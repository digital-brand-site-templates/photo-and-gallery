<!doctype html><html lang="en"><head><meta name="robots" content="noindex, nofollow, noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Gallery</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>img:fullscreen{object-fit:contain;background:#000}</style></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark mb-4"><div class="container"><a class="navbar-brand" href="https://digital-brand-site-templates.github.io/">Digital Brand Site Templates</a></div></nav><main class="container pb-5"><h1 class="h3 mb-4">Photo Gallery</h1><div class="alert alert-secondary">Templates coming soon.</div></main><div class="modal fade" id="fs" tabindex="-1"><div class="modal-dialog modal-fullscreen"><div class="modal-content bg-black"><div class="modal-header border-0"><h5 class="modal-title text-white" id="fsT"></h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body d-flex align-items-center justify-content-center p-0"><img id="fsI" class="img-fluid" style="max-height:100%" alt=""></div></div></div></div>
<script>document.querySelectorAll('.fs-btn').forEach(b=>b.addEventListener('click',()=>{const img=document.getElementById(b.dataset.target);const r=img.requestFullscreen||img.webkitRequestFullscreen;if(r&&(document.fullscreenEnabled||document.webkitFullscreenEnabled)){Promise.resolve(r.call(img)).catch(fb)}else fb();function fb(){fsI.src=img.src;fsT.textContent=b.dataset.name;bootstrap.Modal.getOrCreateInstance(fs).show()}}));</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
